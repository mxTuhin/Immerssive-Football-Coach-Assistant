name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU only; models are faked in tests)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements/dev.txt
          pip install --no-deps -e .
      - name: Lint
        run: ruff check packages workers apps eval scripts tests --select E9,F63,F7,F82
      - name: Tests
        run: pytest -q

  opendata-regression:
    # Blocks merges when our automatic event detection regresses on open data (build plan section 8).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/base.txt && pip install --no-deps -e .
      - name: Pass F1 >= 0.7 vs SkillCorner provider events
        run: python -m fmi_eval.run opendata --matches 1886347 1899585 --min-pass-f1 0.7 --out eval_reports/opendata.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: eval_reports/

  # The V2 (SoccerTrack v2) regression needs the gated dataset + a GPU runner; enable it on a self-hosted
  # runner once the half-match is downloaded (see .claude/skills/evaluate/SKILL.md).
